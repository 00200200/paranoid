<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-size="15" role="img" aria-label="hack-me finds, proves, patches and re-verifies four real vulnerabilities in a running app">
  <style>
    text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
    .dim{fill:#8b949e}.g{fill:#3fb950}.r{fill:#f85149}.b{fill:#58a6ff}
    #l1,#l2,#l3,#l4,#l5,#l6,#l7,#l8,#l9,#l10,#l11{animation:reveal 11s infinite}
    #l1{animation-name:r1}#l2{animation-name:r2}#l3{animation-name:r3}#l4{animation-name:r4}
    #l5{animation-name:r5}#l6{animation-name:r6}#l7{animation-name:r7}#l8{animation-name:r8}
    #l9{animation-name:r9}#l10{animation-name:r10}#l11{animation-name:r11}
    @keyframes r1{0%,2%{opacity:0}4%,96%{opacity:1}100%{opacity:0}}
    @keyframes r2{0%,8%{opacity:0}10%,96%{opacity:1}100%{opacity:0}}
    @keyframes r3{0%,16%{opacity:0}18%,96%{opacity:1}100%{opacity:0}}
    @keyframes r4{0%,23%{opacity:0}25%,96%{opacity:1}100%{opacity:0}}
    @keyframes r5{0%,30%{opacity:0}32%,96%{opacity:1}100%{opacity:0}}
    @keyframes r6{0%,36%{opacity:0}38%,96%{opacity:1}100%{opacity:0}}
    @keyframes r7{0%,42%{opacity:0}44%,96%{opacity:1}100%{opacity:0}}
    @keyframes r8{0%,48%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
    @keyframes r9{0%,57%{opacity:0}59%,96%{opacity:1}100%{opacity:0}}
    @keyframes r10{0%,66%{opacity:0}68%,96%{opacity:1}100%{opacity:0}}
    @keyframes r11{0%,74%{opacity:0}76%,96%{opacity:1}100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect x="6" y="6" width="808" height="488" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="6" y="6" width="808" height="36" rx="10" fill="#161b22"/>
  <rect x="6" y="30" width="808" height="12" fill="#161b22"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="410" y="29" text-anchor="middle" class="dim">hack-me · LedgerLite (localhost:8071)</text>

  <text id="l1"  x="26" y="82"><tspan class="dim">$</tspan> python3 app.py &amp;</text>
  <text id="l2"  x="26" y="112"><tspan class="g">LedgerLite</tspan> <tspan class="dim">running on http://127.0.0.1:8071</tspan></text>
  <text id="l3"  x="26" y="146"><tspan class="dim">$</tspan> <tspan class="b">/hack-me</tspan></text>
  <text id="l4"  x="26" y="178" class="dim">▸ mapping API · probing the classic risk classes…</text>
  <text id="l5"  x="26" y="212" class="r">✗ IDOR — alice read Bob's invoice (HTTP 200)</text>
  <text id="l6"  x="26" y="240" class="r">✗ authz — /admin/users open to any logged-in user</text>
  <text id="l7"  x="26" y="268" class="r">✗ sqli — /search UNION dumped plaintext passwords</text>
  <text id="l8"  x="26" y="296" class="r">✗ privesc — POST /profile {is_admin:1} made alice admin</text>
  <text id="l9"  x="26" y="330" class="dim">▸ patching root causes · replaying the exact exploits…</text>
  <text id="l10" x="26" y="364" class="g">✓ blocked now: 404 · 403 · [] · 400</text>
  <text id="l11" x="26" y="392" class="g">✓ happy paths still 200 — 4 found, proven, patched, verified</text>

  <text x="26" y="440"><tspan class="dim">$</tspan> <tspan class="cur">▌</tspan></text>
</svg>
