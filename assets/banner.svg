<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="paranoid — your app is guilty until proven secure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219"/><stop offset="1" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f85149"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd455"/><stop offset="0.5" stop-color="#2ee6d6"/><stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- mascot -->
  <g>
    <rect x="120" y="232" width="184" height="176" rx="40" fill="url(#bezel)"/>
    <rect x="146" y="258" width="132" height="124" rx="24" fill="#0b0f14"/>
    <path d="M168 284 l28 9" stroke="#e6edf3" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M256 284 l-28 9" stroke="#e6edf3" stroke-width="5.5" stroke-linecap="round"/>
    <ellipse cx="191" cy="312" rx="18" ry="21" fill="#e6edf3"/>
    <ellipse cx="233" cy="312" rx="18" ry="21" fill="#e6edf3"/>
    <circle cx="199" cy="307" r="8" fill="#0b0f14"/>
    <circle cx="241" cy="307" r="8" fill="#0b0f14"/>
    <circle cx="202" cy="304" r="2.8" fill="#e6edf3"/>
    <circle cx="244" cy="304" r="2.8" fill="#e6edf3"/>
    <text x="212" y="366" font-size="21" font-weight="700" text-anchor="middle"><tspan fill="#2bd455">&gt;</tspan><tspan fill="#ff6b6b">_</tspan></text>
  </g>

  <!-- wordmark + one line -->
  <text x="356" y="330" font-size="132" font-weight="800" letter-spacing="-4" fill="#e6edf3">paranoid</text>
  <rect x="360" y="354" width="208" height="7" rx="3.5" fill="url(#rg)"/>
  <text x="360" y="410" font-size="32" fill="#9aa4b1">Your app is guilty until proven secure.</text>
</svg>
