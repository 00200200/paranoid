<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="paranoid mascot: a terminal giving a suspicious side-eye">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd455"/><stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
  </defs>
  <!-- bright bezel -->
  <rect x="14" y="14" width="228" height="228" rx="56" fill="url(#bezel)"/>
  <!-- dark screen keeps the terminal identity -->
  <rect x="38" y="44" width="180" height="168" rx="38" fill="#0b0f14"/>
  <!-- brows: heavy enough to survive small sizes -->
  <path d="M64 96 L124 114" stroke="#e6edf3" stroke-width="11" stroke-linecap="round"/>
  <path d="M198 92 L146 110" stroke="#e6edf3" stroke-width="11" stroke-linecap="round"/>
  <!-- asymmetric eyes: one wide, one narrowed = side-eye, and it still reads at 32px -->
  <ellipse cx="100" cy="142" rx="31" ry="35" fill="#e6edf3"/>
  <ellipse cx="163" cy="144" rx="29" ry="19" fill="#e6edf3"/>
  <circle cx="113" cy="138" r="14" fill="#0b0f14"/>
  <circle cx="174" cy="144" r="12" fill="#0b0f14"/>
  <circle cx="118" cy="132" r="4.5" fill="#e6edf3"/>
  <circle cx="178" cy="140" r="3.5" fill="#e6edf3"/>
</svg>
