<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="paranoid mascot: a nervous, wide-eyed terminal that trusts nothing">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd455"/><stop offset="0.5" stop-color="#2ee6d6"/><stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  </defs>
  <!-- bright bezel -->
  <rect x="14" y="14" width="228" height="228" rx="56" fill="url(#bezel)"/>
  <!-- dark screen keeps the terminal identity -->
  <rect x="42" y="48" width="172" height="164" rx="34" fill="#0b0f14"/>
  <!-- worried eyebrows -->
  <path d="M82 106 l38 12" stroke="#e6edf3" stroke-width="7" stroke-linecap="round"/>
  <path d="M174 106 l-38 12" stroke="#e6edf3" stroke-width="7" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="106" cy="146" rx="26" ry="30" fill="#e6edf3"/>
  <ellipse cx="150" cy="146" rx="26" ry="30" fill="#e6edf3"/>
  <circle cx="117" cy="140" r="11" fill="#0b0f14"/>
  <circle cx="161" cy="140" r="11" fill="#0b0f14"/>
  <circle cx="121" cy="136" r="3.6" fill="#e6edf3"/>
  <circle cx="165" cy="136" r="3.6" fill="#e6edf3"/>
  <!-- prompt mouth -->
  <text x="128" y="200" font-size="28" font-weight="700" text-anchor="middle"><tspan fill="#2bd455">&gt;</tspan><tspan fill="#ff6b6b">_</tspan></text>
  <!-- bright sweat drop -->
  <path d="M210 66 c-9 13 -13 19 -13 25 a13 13 0 0 0 26 0 c0 -6 -4 -12 -13 -25 z" fill="#eafcff" stroke="#4c8dff" stroke-width="2"/>
</svg>
